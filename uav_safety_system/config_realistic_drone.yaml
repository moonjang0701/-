# UAV 공역 안전성 측정 시스템 - 현실적인 소형 드론 시나리오
# 운영 방식: 한 시간당 20대 운영
# 공역: 1500m x 900m
# 드론: 소형 상업용 드론 (DJI Mavic 급)

# UAV 비행 성능 파라미터 (소형 드론에 맞게 조정)
uav_performance:
  Vf: 1.0          # 최대 전방 속도 (km/min) = 60 km/h = 16.7 m/s
  Vb: 0.5          # 최대 후방 속도 (km/min) = 30 km/h
  Va: 0.3          # 최대 상승 속도 (km/min) = 5 m/s
  Vd: 0.4          # 최대 하강 속도 (km/min) = 6.7 m/s
  Vl: 0.8          # 최대 횡방향 속도 (km/min) = 48 km/h
  response_time: 10  # 응답 시간 (seconds) - 빠른 반응

# 위치 불확실성 파라미터 (GPS 정확도 높음)
uncertainty:
  r_A1: 0.05       # along-track 분산 성장률 (정밀 GPS)
  r_A2: 0.05       # cross-track 분산 성장률 1
  r_A3: 0.05       # cross-track 분산 성장률 2

# 공역 설정 (1500m x 900m)
airspace:
  x_min: 0         # 공역 X축 최소값 (km)
  x_max: 1.5       # 공역 X축 최대값 (km) - 1500m
  y_min: 0         # 공역 Y축 최소값 (km)
  y_max: 0.9       # 공역 Y축 최대값 (km) - 900m
  z_min: 0         # 공역 Z축 최소값 (km)
  z_max: 0.15      # 공역 Z축 최대값 (km) - 150m (저고도)
  grid_resolution: 0.05  # 그리드 셀 크기 (km) = 50m
  # 그리드 포인트: 30 x 18 x 3 = 1,620 포인트

# 시뮬레이션 설정 (1시간 단위 운영)
simulation:
  time_step: 0.5   # 시뮬레이션 시간 간격 (min)
  total_time: 60   # 총 시뮬레이션 시간 (min) = 1시간
  waypoint_count: 50  # 경로점 개수
  safety_threshold: 0.01  # 충돌 확률 임계값 (1%)

# 경로 계획 (임의의 출발점, 최대 1.5km 배송 거리)
trajectory:
  start_position: [0.75, 0.0, 0.075]   # 베이스에서 출발
  end_position: [0.75, 1.5, 0.075]     # 목적지 (1.5km 배송)
  velocity: [0, 3, 0]                  # 순항 속도 (3 km/min = 50 m/s)
  gamma: 1.0                           # 안전 가중치

# 출력 설정
output:
  result_directory: "output/realistic_drone"  # 결과 저장 디렉토리
  save_plots: true              # 시각화 결과 저장 여부
  save_csv: true                # CSV 데이터 저장 여부
  plot_format: "png"            # 플롯 이미지 포맷
  plot_dpi: 200                 # 플롯 해상도
